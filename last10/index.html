<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c1117">
  <title>Last 10 Incidents · PTFD</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-pulse" viewBox="0 0 24 24"><path d="M2 12h5l3-8 4 16 3-8h5"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></symbol>
  </svg>
  <main class="board" aria-label="Last ten incidents">
    <section id="empty-state" class="empty-state" hidden><svg aria-hidden="true"><use href="#icon-pulse"/></svg><h2>No incidents yet</h2><p>New incidents will appear here automatically.</p></section>
    <section id="loading-state" class="empty-state" aria-label="Loading incidents"><span class="loader" aria-hidden="true"></span><h2>Connecting to incident feed</h2><p id="loading-detail">The latest calls will appear here automatically.</p></section>
    <ol id="runs-list" class="incident-grid" aria-label="Last ten incidents, newest first" hidden></ol>
    <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="retry" type="button" hidden><svg aria-hidden="true"><use href="#icon-refresh"/></svg>Retry connection</button></div>
    <p id="feed-announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <template id="incident-template"><li class="incident-card"><div class="run-identity"><span class="run-label">Run</span><strong class="run-number"></strong></div><article>
    <div class="card-heading"><h3 class="nature"></h3><span class="latest-tag" hidden>Latest</span></div>
    <p class="address"><svg aria-hidden="true"><use href="#icon-pin"/></svg><span></span></p>
    <div class="card-footer"><span class="incident-type"></span><span class="dispatch"><svg aria-hidden="true"><use href="#icon-clock"/></svg><time></time></span></div>
  </article></li></template>
  <noscript><p class="notice">Enable JavaScript to view the live incident board.</p></noscript>
</body>
</html>
