<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151b">
  <title>Daily Tasks · PTFD</title>
  <link rel="stylesheet" href="styles.css">
  <script src="board.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <div class="board">
    <main class="board-main">
      <div class="section-heading"><h1>Today's assignments</h1><p id="task-count" role="status">Loading schedule</p></div>
      <section id="task-board" class="task-grid" aria-label="Today's tasks" hidden></section>
      <section id="message-container" class="message-panel" role="status">
        <div class="message-mark" aria-hidden="true">—</div><h2 id="message-title">Getting today's tasks</h2><p id="message-text">Connecting to the station schedule…</p>
      </section>
      <noscript><p>Enable JavaScript to display today's assignments.</p></noscript>
    </main>
  </div>
</body>
</html>
