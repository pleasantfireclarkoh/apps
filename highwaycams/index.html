<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>I-70 TRAFFIC CAMERAS</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #080d13;
            color: #edf2f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            background:
                radial-gradient(ellipse at 50% 0%, #1b2b3b80, transparent 65%),
                #080d13;
        }

        .dashboard {
            width: min(100%, 1920px);
            margin-inline: auto;
            padding: clamp(24px, 4vw, 64px);
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 3vw, 48px);
            margin: 0 0 clamp(28px, 4vw, 56px);
        }

        .page-header::before,
        .page-header::after {
            content: '';
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, transparent, #455b6f80);
        }

        .page-header::after { transform: rotate(180deg); }

        h1 {
            margin: 0;
            font-size: clamp(18px, 2.2vw, 34px);
            font-weight: 650;
            line-height: 1.3;
            letter-spacing: .14em;
            text-align: center;
            text-wrap: balance;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(16px, 2vw, 32px);
        }

        .camera-card {
            position: relative;
            margin: 0;
            padding: 6px;
            border: 1px solid #34465780;
            border-radius: 16px;
            background: linear-gradient(145deg, #22303c80, #101820);
            box-shadow: 0 20px 60px #00000040, inset 0 1px #ffffff05;
        }

        .camera-view {
            position: relative;
            display: grid;
            place-items: center;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 10px;
            background: #0c131b;
        }

        .spinner {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 2px solid #ffffff12;
            border-top-color: #8ba7bc;
            border-radius: 50%;
            animation: spin 1.1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .camera-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
        }

        .camera-card[data-state="ready"] .camera-img { opacity: 1; }
        .camera-card:not([data-state="loading"]) .spinner { display: none; }

        .unavailable-icon {
            display: none;
            width: 36px;
            height: 36px;
            color: #657687;
        }

        .camera-card[data-state="unavailable"] .unavailable-icon { display: block; }

        @media (max-width: 760px) {
            .dashboard { padding: 28px 16px; }
            .camera-grid { grid-template-columns: 1fr; }
            h1 { letter-spacing: .1em; }
            .page-header { gap: 12px; }
            .camera-card { padding: 4px; border-radius: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="page-header">
            <h1>I-70 TRAFFIC CAMERAS</h1>
        </header>
        <main id="camera-container" class="camera-grid" aria-label="I-70 traffic camera feeds"></main>
    </div>

    <script>
        const cameraContainer = document.getElementById('camera-container');
        
        // Configuration
        const bearerToken = '2bd6a482-97de-478e-812d-50b245075206';
        const apiUrl = `https://publicapi.ohgo.com/api/v1/cameras/00000000000226%2C00000000000638?page-size=2&page-all=all`;
        
        const REFRESH_RATE = 2000;
        const cameraSlots = Array.from({ length: 2 }, createCameraSlot);
        let activeCameras = [];

        function createCameraSlot() {
            const card = document.createElement('figure');
            card.className = 'camera-card';
            card.dataset.state = 'loading';
            card.setAttribute('aria-label', 'Loading traffic camera');
            card.innerHTML = `
                <div class="camera-view">
                    <div class="spinner" aria-hidden="true"></div>
                    <svg class="unavailable-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
                        <path d="M3 3l18 18M10 6h6a2 2 0 0 1 2 2v2l4-3v10l-4-3v2M14 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <img class="camera-img" alt="" decoding="async">
                </div>`;
            cameraContainer.appendChild(card);
            return card;
        }

        function markUnavailable(card) {
            card.dataset.state = 'unavailable';
            card.setAttribute('aria-label', 'Traffic camera unavailable; retrying automatically');
        }

        async function initCameras() {
            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        'accept': 'application/json',
                        'Authorization': `Bearer ${bearerToken}`
                    },
                    signal: AbortSignal.timeout(15000)
                });

                if (!response.ok) {
                    let errorText = `API request failed with status ${response.status}: ${response.statusText}.`;
                    if (response.status === 401 || response.status === 403) {
                        errorText += " Token invalid/expired.";
                    }
                    throw new Error(errorText);
                }

                const result = await response.json();
                const cameras = (result.results || []).filter(camera => camera.cameraViews?.[0]?.largeUrl).slice(0, 2);
                if (cameras.length === 0) throw new Error('No active camera feeds found.');

                activeCameras = cameras.map((camera, index) => {
                    const card = cameraSlots[index];
                    const img = card.querySelector('img');
                    img.alt = camera.description || 'I-70 traffic camera';
                    card.setAttribute('aria-label', img.alt);
                    return { card, img, baseUrl: camera.cameraViews[0].largeUrl, pending: false };
                });
                cameraSlots.slice(cameras.length).forEach(markUnavailable);
                activeCameras.forEach(updateCameraImage);
                if (cameras.length < cameraSlots.length) {
                    setTimeout(initCameras, 30000);
                }
            } catch (error) {
                console.error('Error initializing cameras:', error);
                cameraSlots.forEach(card => {
                    if (card.dataset.state !== 'ready') markUnavailable(card);
                });
                setTimeout(initCameras, 30000);
            }
        }

        // Preload each frame so refreshing never blanks a working feed.
        function updateCameraImage(camera) {
            if (camera.pending || document.hidden) return;
            camera.pending = true;
            const nextUrl = new URL(camera.baseUrl, window.location.href);
            nextUrl.searchParams.set('t', Date.now());
            const frame = new Image();
            const timeout = setTimeout(() => {
                frame.onload = frame.onerror = null;
                camera.pending = false;
                if (camera.card.dataset.state !== 'ready') markUnavailable(camera.card);
            }, 15000);

            frame.onload = () => {
                clearTimeout(timeout);
                camera.img.src = nextUrl.href;
                camera.card.dataset.state = 'ready';
                camera.card.setAttribute('aria-label', camera.img.alt);
                camera.pending = false;
            };
            frame.onerror = () => {
                clearTimeout(timeout);
                camera.pending = false;
                if (camera.card.dataset.state !== 'ready') markUnavailable(camera.card);
            };
            frame.src = nextUrl.href;
        }

        initCameras();
        setInterval(() => activeCameras.forEach(updateCameraImage), REFRESH_RATE);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) activeCameras.forEach(updateCameraImage);
        });
    </script>

</body>
</html>
