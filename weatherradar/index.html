<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catawba & Pleasant Township - Active Weather Radar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        /* Ensure the map takes up the full screen behind the UI */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; }
        
        /* Position the control panel over the map */
        #radar-controls {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        /* Add smooth fading to the radar map layers */
        .radar-layer {
            transition: opacity 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 font-sans">

    <div id="map"></div>

    <div id="radar-controls" class="w-auto min-w-[250px] bg-gray-900/80 backdrop-blur-md border border-gray-700 rounded-2xl px-6 py-4 shadow-2xl flex flex-col items-center justify-center transition-all">
        <h2 class="text-gray-100 font-semibold text-xl tracking-wide">Weather Radar</h2>
        <span id="timestamp" class="text-blue-400 text-base font-medium font-mono mt-1">Loading data...</span>
    </div>

    <script>
        // 1. Initialize Map centered on Catawba/Pleasant Township
        const CENTER_COORDS = [39.975833, -83.610278]; // Adjusted slightly to center both areas
        const map = L.map('map', {
            zoomControl: false,
            dragging: false,
            touchZoom: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false
        }).setView(CENTER_COORDS, 12);

        // 2. Set up Base Map (Esri Topographic)
        const topoMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 19,
            maxNativeZoom: 18
        }).addTo(map);

        // 3. Radar Application State Variables
        let radarFrames = [];
        let radarLayers = {};
        let currentFrame = 0;

        // DOM Elements
        const timestampDisplay = document.getElementById('timestamp');

        // 4. Fetch and setup RainViewer Radar Data
        async function fetchRadarData() {
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                
                const past = data.radar.past || [];
                const nowcast = data.radar.nowcast || [];
                
                radarFrames = [...past, ...nowcast];
                currentFrame = past.length > 0 ? past.length - 1 : 0; 

                radarFrames.forEach(frame => {
                    const url = `${data.host}${frame.path}/256/{z}/{x}/{y}/4/1_1.png`;
                    const layer = L.tileLayer(url, {
                        opacity: 0,
                        zIndex: 10,
                        className: 'radar-layer',
                        maxNativeZoom: 7
                    });
                    layer.addTo(map);
                    radarLayers[frame.time] = layer;
                });

                updateMapFrame();
                playLoop();

            } catch (error) {
                console.error("Failed to load RainViewer radar data:", error);
                timestampDisplay.innerText = "Error loading radar data";
            }
        }

        // 5. Core update logic for changing frames
        function updateMapFrame() {
            if (radarFrames.length === 0) return;
            
            const activeFrame = radarFrames[currentFrame];
            const activeTime = activeFrame.time;
            
            radarFrames.forEach(f => radarLayers[f.time].setOpacity(0));
            radarLayers[activeTime].setOpacity(0.65);

            const date = new Date(activeTime * 1000);
            const formattedTime = date.toLocaleTimeString([], { 
                weekday: 'short', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            timestampDisplay.innerText = formattedTime;
        }

        // 6. Playback Animation Loop
        function playLoop() {
            currentFrame++;
            let delay = 400;

            if (currentFrame >= radarFrames.length) {
                currentFrame = 0; 
                delay = 1200;
            }

            updateMapFrame();
            setTimeout(playLoop, delay);
        }

        // 7. Fetch and draw local Jurisdiction Boundary
        async function highlightJurisdiction() {
            try {
                // Fetch the uploaded GeoJSON file directly from the local directory
                const response = await fetch('./pleasant.geojson');
                
                if (!response.ok) {
                    throw new Error("Could not find pleasant.geojson. Ensure it is in the same folder and you are running a local server.");
                }
                
                const data = await response.json();
                
                // Add the loaded data to the map with high-visibility styling
                L.geoJSON(data, {
                    style: {
                        color: '#ef4444', // High-vis red
                        weight: 3,
                        opacity: 0.9,
                        fillColor: '#ef4444',
                        fillOpacity: 0.05,
                        dashArray: '6, 8'
                    },
                    interactive: false 
                }).addTo(map);
                
            } catch (error) {
                console.error("Failed to load jurisdiction boundary:", error);
            }
        }

        // Boot the app
        fetchRadarData();
        highlightJurisdiction();

    </script>
</body>
</html>
